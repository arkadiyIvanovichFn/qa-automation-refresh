# ============================================
# Конфигурация тестового фреймворка
# ============================================

# URL приложения (можно менять для разных окружений)
base.url=https://www.saucedemo.com/

# Браузер для запуска тестов (chrome, firefox, edge)
browser=chrome

# Режим headless (true = без открытия окна браузера)
headless=false

# Таймаут ожидания элементов в миллисекундах
timeout=4000

# Имя ресурса
app.name=Sauce Labs Demo

# Тестовые учётные данные (вынесены из кода)
login.username=standard_user
login.password=secret_sauce
login.locked_user=locked_out_user